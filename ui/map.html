  const collectCoordinates = (value, output = []) => {
    if (Array.isArray(value) && value.length >= 2 && typeof value[0] === 'number' && typeof value[1] === 'number') output.push([value[0], value[1]]);
    else if (Array.isArray(value)) value.forEach(item => collectCoordinates(item, output));
    return output;
  };
  const asCollection = features => ({type: 'FeatureCollection', features: features.filter(feature => feature?.geometry)});

  function projectionFor(background, territory) {
    const fitFeatures = background.length ? background : territory;
    const collection = asCollection(fitFeatures);
    if (window.d3?.geoMercator && collection.features.length) return window.d3.geoMercator().fitExtent([[6, 6], [94, 94]], collection);
    const all = collection.features.flatMap(feature => collectCoordinates(feature.geometry.coordinates));
    if (!all.length) return () => [50, 50];
    const mercatorY = latitude => Math.log(Math.tan(Math.PI / 4 + Number(latitude) * Math.PI / 360));
    const projected = all.map(([longitude, latitude]) => [Number(longitude), mercatorY(latitude)]);
    const xs = projected.map(point => point[0]);
    const ys = projected.map(point => point[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const dx = Math.max(maxX - minX, .0001), dy = Math.max(maxY - minY, .0001);
    const scale = Math.min(88 / dx, 88 / dy);
    const width = dx * scale, height = dy * scale;
    const offsetX = (100 - width) / 2, offsetY = (100 - height) / 2;
    return ([longitude, latitude]) => [offsetX + (Number(longitude) - minX) * scale, offsetY + (maxY - mercatorY(latitude)) * scale];
  }

  function osmRoadsSvg(roads, projection, clipPaths, enabled) {
    const features = roads?.features || [];
    if (!enabled || !features.length) return '<g class="osm-roads is-hidden" aria-hidden="true"></g>';
    const widthFor = highway => ({motorway: .42, trunk: .38, primary: .32, secondary: .27, tertiary: .21, unclassified: .14, residential: .12, living_street: .1, service: .075, track: .065, path: .05, footway: .045}[highway] || .09);
    const paths = features.map(feature => {
      const highway = String(feature.properties?.highway || '');
      const width = widthFor(highway);
      return `<path d="${pathFor(feature.geometry, projection)}" stroke-width="${width}" data-highway="${esc(highway)}"></path>`;
    }).join('');
    return `<g class="osm-roads" clip-path="url(#municipality-clip)" role="img" aria-label="Líneas viales de OpenStreetMap recortadas al municipio">${paths}</g>`;
  }

  async function ensureOsmRoads() {
    if (!publicMap || !host?.publicMapOsmRoadsUrl || !osmEnabled || osmRoads !== null || osmRoadsLoading) return;
    osmRoadsLoading = true;
    try {
      const response = await fetch(host.publicMapOsmRoadsUrl, {cache: 'force-cache'});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      osmRoads = await response.json();
    } catch (_) {
      osmRoads = {type: 'FeatureCollection', features: [], error: 'No fue posible cargar las líneas viales.'};
    } finally {
      osmRoadsLoading = false;
      render();
    }
  }

  function pathFor(geometry, projection) {
    if (!geometry) return '';
    if (window.d3?.geoPath) return window.d3.geoPath(projection)({type: 'Feature', geometry});
    const ringPath = ring => !ring?.length ? '' : `M${ring.map(point => projection(point).join(',')).join('L')}Z`;
    if (geometry.type === 'Polygon') return geometry.coordinates.map(ringPath).join('');
    if (geometry.type === 'MultiPolygon') return geometry.coordinates.flatMap(polygon => polygon.map(ringPath)).join('');
    return '';
  }

  function centroidFor(geometry, projection) {
    if (!geometry) return null;
    if (window.d3?.geoCentroid) {
      const centroid = projection(window.d3.geoCentroid({type: 'Feature', geometry}));
      if (centroid?.every(Number.isFinite)) return centroid;
    }
    const coordinates = collectCoordinates(geometry.coordinates);
    if (!coordinates.length) return null;
    const average = coordinates.reduce((point, coordinate) => [point[0] + coordinate[0], point[1] + coordinate[1]], [0, 0]);
    return projection([average[0] / coordinates.length, average[1] / coordinates.length]);
  }

  function terrainImageUrl(features) {
    const coordinates = features.flatMap(feature => collectCoordinates(feature.geometry?.coordinates));
    if (!coordinates.length) return '';
    const longitudes = coordinates.map(point => point[0]);
    const latitudes = coordinates.map(point => point[1]);
    const minLongitude = Math.min(...longitudes);
    const maxLongitude = Math.max(...longitudes);
    const minLatitude = Math.max(-85, Math.min(...latitudes));
    const maxLatitude = Math.min(85, Math.max(...latitudes));
    const padding = .015;
    const params = new URLSearchParams({
      bbox: `${minLongitude - padding},${minLatitude - padding},${maxLongitude + padding},${maxLatitude + padding}`,
      bboxSR: '4326',
      imageSR: '4326',
      size: '1400,1000',
      format: 'jpg',
      f: 'image',
      transparent: 'false'
    });
    return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/export?${params.toString()}`;
  }

  function clipHalfPlane(polygon, site, other) {
    if (!polygon.length) return [];
    const a = 2 * (other[0] - site[0]);
    const b = 2 * (other[1] - site[1]);
    const c = other[0] * other[0] + other[1] * other[1] - site[0] * site[0] - site[1] * site[1];
    const inside = point => a * point[0] + b * point[1] <= c + 1e-8;
    const intersection = (start, end) => {
      const denominator = a * (end[0] - start[0]) + b * (end[1] - start[1]);
      if (Math.abs(denominator) < 1e-12) return end;
      const t = (c - a * start[0] - b * start[1]) / denominator;
      return [start[0] + t * (end[0] - start[0]), start[1] + t * (end[1] - start[1])];
    };
    const output = [];
    for (let index = 0; index < polygon.length; index += 1) {
      const start = polygon[index];
      const end = polygon[(index + 1) % polygon.length];
      const startInside = inside(start);
      const endInside = inside(end);
      if (startInside && endInside) output.push(end);
      else if (startInside && !endInside) output.push(intersection(start, end));
      else if (!startInside && endInside) output.push(intersection(start, end), end);
    }
    return output;
  }

  function influenceCells(sites, projection) {
    const seen = new Map();
    const prepared = sites.map((site, sourceIndex) => {
      const projected = projection([Number(site.longitude), Number(site.latitude)]);
      if (!projected || !projected.every(Number.isFinite)) return null;
      const coordinateKey = projected.map(value => value.toFixed(5)).join(':');
      const duplicate = seen.get(coordinateKey) || 0;
      seen.set(coordinateKey, duplicate + 1);
      return {site, sourceIndex, point: [projected[0] + duplicate * .015, projected[1] + duplicate * .015]};
    }).filter(Boolean);
    return prepared.map((item, index) => {
      let polygon = [[0, 0], [100, 0], [100, 100], [0, 100]];
      prepared.forEach((other, otherIndex) => {
        if (otherIndex !== index && polygon.length) polygon = clipHalfPlane(polygon, item.point, other.point);
      });
      const path = polygon.length ? `M${polygon.map(point => point.join(',')).join('L')}Z` : '';
      return {...item, path};
    }).filter(item => item.path);
  }

  const institutionalColors = ['#dce9e4', '#93b5a9', '#bc955b', '#9f5264', '#691c32'];
  const categoryColors = ['#7b1e3a', '#1f5a4a', '#b38b59', '#4b6682', '#9c5a4f', '#3b806d', '#866b46', '#5a7182'];
  function frequencyColor(value, max) {
    const numeric = Number(value || 0);
    if (numeric === 0) return '#f5efe5';
    const ratio = numeric / Math.max(1, Number(max || 1));
    return institutionalColors[Math.min(institutionalColors.length - 1, Math.ceil(ratio * institutionalColors.length) - 1)];
  }
  function categoryColor(category, categories) {
    const index = Math.max(0, categories.indexOf(String(category || '')));
    return categoryColors[index % categoryColors.length];
  }
  function mapValue(properties, data) {
    if (data.map_type === 'dominant') return Number(properties.total_participations || 0);
    if (data.map_type === 'frequency' && metricMode === 'percentage') return Number(properties.percentage_locality || 0);
    return Number(properties.value ?? properties.frequency ?? 0);
  }
  function displayMapValue(value, data) {
    return data.map_type === 'frequency' && metricMode === 'percentage' ? `${percent(value)}%` : number(value);
  }
  function paintFor(properties, data, max, gradientId) {
    if (data.map_type === 'composition') {
      const categories = data.response_categories || [];
      const counts = properties.answer_counts || {};
      const entries = categories.map(category => [category, Number(counts[category] || 0)]).filter(([, count]) => count > 0);
      const total = entries.reduce((sum, [, count]) => sum + count, 0);
      const maxTotal = Number(data.metrics?.max_locality_responses || 0);
      const opacity = .78 + .22 * Math.sqrt(Number(properties.total_participations || 0) / Math.max(1, maxTotal || Number(properties.total_participations || 0)));
      if (!entries.length || !total) return {fill: '#f5efe5', definition: '', opacity: .72};
      if (entries.length === 1) return {fill: categoryColor(entries[0][0], categories), definition: '', opacity};
      let cursor = 0;
      const stops = entries.map(([category, count]) => {
        const start = cursor / total * 100;
        cursor += count;
        const end = cursor / total * 100;
        const color = categoryColor(category, categories);
        return `<stop offset="${start}%" stop-color="${color}"></stop><stop offset="${end}%" stop-color="${color}"></stop>`;
      }).join('');
      return {fill: `url(#${gradientId})`, definition: `<linearGradient id="${gradientId}" x1="0" y1="0" x2="1" y2="0">${stops}</linearGradient>`, opacity};
    }
    if (data.map_type !== 'dominant') return {fill: frequencyColor(mapValue(properties, data), max), definition: '', opacity: 1};
    const categories = data.response_categories || [];
    const dominant = String(properties.dominant_answer || '');
    const total = Number(properties.total_participations || 0);
    if (!dominant || !total) return {fill: '#f5efe5', definition: '', opacity: .72};
    const maxTotal = Number(data.metrics?.max_locality_responses || total);
    const opacity = .86 + .14 * Math.sqrt(total / Math.max(1, maxTotal));
    return {fill: categoryColor(dominant, categories), definition: '', opacity};
  }

  function answerCountsHtml(properties, data) {
    const counts = properties.answer_counts || {};
    const categories = data.response_categories || Object.keys(counts);
    const total = Number(properties.total_response_mentions || properties.total_participations || Object.values(counts).reduce((sum, value) => sum + Number(value || 0), 0));
    return categories.filter(category => Number(counts[category] || 0) > 0).map(category => {
      const count = Number(counts[category] || 0);
      const share = total ? count / total * 100 : 0;
      return `${esc(category)}: ${number(count)} (${percent(share)}%)`;
    }).join('<br>');
  }

  function showTooltip(element, html) {
    const tip = root.querySelector('#tip');
    const wrap = root.querySelector('.map-wrap');
    if (!tip || !wrap) return;
    tip.hidden = false;
    tip.innerHTML = html;
    const box = wrap.getBoundingClientRect();
    const rect = element.getBoundingClientRect();
    tip.style.left = `${Math.min(Math.max(rect.left - box.left + 8, 8), Math.max(8, box.width - 320))}px`;
    tip.style.top = `${Math.max(rect.top - box.top - 8, 8)}px`;
  }

  function bindMapPaths(baseFeatures, dataFeatures, cells, data) {
    const tip = root.querySelector('#tip');
    const hide = () => { if (tip) tip.hidden = true; };
    root.querySelectorAll('.official-base').forEach(path => {
      const properties = baseFeatures[Number(path.dataset.index)]?.properties || {};
      const kind = properties.geometry_kind === 'settlement' ? 'Colonia o asentamiento oficial' : 'Localidad amanzanada oficial';
      const show = () => showTooltip(path, `<strong>${esc(properties.locality || 'Unidad sin nombre')}</strong><span class="tip-kind">${kind}</span><br>Sin registros vinculados en el Excel<br>Clave: ${esc(properties.official_key || 'No disponible')}`);
      path.addEventListener('mouseenter', show); path.addEventListener('focus', show);
      path.addEventListener('mouseleave', hide); path.addEventListener('blur', hide);
    });
    root.querySelectorAll('.official-data').forEach(path => {
      const properties = dataFeatures[Number(path.dataset.index)]?.properties || {};
      const kind = properties.geometry_kind === 'settlement' ? 'Colonia o asentamiento oficial' : 'Localidad amanzanada oficial';
      const mix = answerCountsHtml(properties, data);
      const frequencyLine = data.map_type === 'composition' ? 'Composición porcentual de respuestas' : data.map_type === 'dominant' ? `Respuesta predominante: ${esc(properties.dominant_answer || 'No disponible')} (${number(properties.frequency)})` : `Frecuencia de “${esc(data.answer)}”: ${number(properties.value ?? properties.frequency)}`;
      const distribution = data.map_type === 'composition' ? `Menciones agrupadas: ${number(properties.total_response_mentions || properties.frequency)}` : `Porcentaje local: ${number(properties.percentage_locality)}%`;
      const show = () => showTooltip(path, `<strong>${esc(properties.locality || 'Unidad sin nombre')}</strong><span class="tip-kind">${kind}</span><br>${frequencyLine}<br>Respuestas válidas: ${number(properties.total_participations)}<br>${distribution}${mix ? `<br><br>${mix}` : ''}<br>Clave: ${esc(properties.official_key || 'No disponible')}`);
      path.addEventListener('mouseenter', show); path.addEventListener('focus', show);
      path.addEventListener('mouseleave', hide); path.addEventListener('blur', hide);
    });
    root.querySelectorAll('.influence-zone').forEach(path => {
      const site = cells[Number(path.dataset.index)]?.site || {};
      const mix = answerCountsHtml(site, data);
      const frequencyLine = data.map_type === 'composition' ? 'Composición porcentual de respuestas' : data.map_type === 'dominant' ? `Respuesta predominante: ${esc(site.dominant_answer || 'No disponible')} (${number(site.frequency)})` : `Frecuencia de “${esc(data.answer)}”: ${number(site.value ?? site.frequency)}`;
      const distribution = data.map_type === 'composition' ? `Menciones agrupadas: ${number(site.total_response_mentions || site.frequency)}` : `Porcentaje local: ${number(site.percentage_locality)}%`;
      const show = () => showTooltip(path, `<strong>${esc(site.locality || 'Localidad')}</strong><span class="tip-kind">Zona de influencia analítica · no es un límite oficial</span><br>${frequencyLine}<br>Respuestas válidas: ${number(site.total_participations)}<br>${distribution}${mix ? `<br><br>${mix}` : ''}<br>Sitio: ${esc(site.site_source || 'coordenada geográfica confiable')}`);
      path.addEventListener('mouseenter', show); path.addEventListener('focus', show);
      path.addEventListener('mouseleave', hide); path.addEventListener('blur', hide);
    });
  }

  function mapLegend(data) {
    if (data.map_type === 'composition') {
      const categories = data.response_categories || [];
      return `<div class="key-title">Todas las respuestas · composición (%)</div>${categories.map((category, index) => `<div class="key-row"><i class="swatch" style="background:${categoryColors[index % categoryColors.length]}"></i>${esc(category)}</div>`).join('')}<div class="key-row"><i class="swatch" style="background:var(--monte)"></i>Monte / área sin localidad</div><div class="key-row"><i class="swatch" style="background:var(--sin-datos)"></i>Localidad oficial sin registro</div><div class="key-note">Cada polígono con datos contiene todas las categorías. El ancho de cada franja representa su porcentaje dentro de la localidad o colonia. El verde tenue identifica áreas fuera de las localidades representadas.</div>`;
    }
    if (data.map_type === 'dominant') {
      const categories = data.response_categories || [];
      return `<div class="key-title">Respuesta predominante</div>${categories.map((category, index) => `<div class="key-row"><i class="swatch" style="background:${categoryColors[index % categoryColors.length]}"></i>${esc(category)}</div>`).join('')}<div class="key-note">Cada territorio se pinta con el color de la respuesta más frecuente. Haz clic en una localidad para consultar su frecuencia y porcentaje.</div>`;
    }
    const percentageMode = data.map_type === 'frequency' && metricMode === 'percentage';
    return `<div class="key-title">${percentageMode ? 'Porcentaje local' : 'Frecuencia'} · ${esc(data.answer || '')}</div>
      ${percentageMode ? `
      <div class="key-row"><i class="swatch" style="background:#691c32"></i>80–100%</div>
      <div class="key-row"><i class="swatch" style="background:#9f5264"></i>60–80%</div>
      <div class="key-row"><i class="swatch" style="background:#bc955b"></i>40–60%</div>
      <div class="key-row"><i class="swatch" style="background:#93b5a9"></i>20–40%</div>
      <div class="key-row"><i class="swatch" style="background:#dce9e4"></i>Más de 0–20%</div>` : `
      <div class="key-row"><i class="swatch" style="background:#691c32"></i>Mayor frecuencia</div>
      <div class="key-row"><i class="swatch" style="background:#bc955b"></i>Frecuencia media</div>
      <div class="key-row"><i class="swatch" style="background:#93b5a9"></i>Menor frecuencia</div>`}
      <div class="key-row"><i class="swatch" style="background:var(--cero)"></i>${percentageMode ? '0%' : '0 menciones en esa localidad'}</div>
      <div class="key-note">${percentageMode ? 'La intensidad indica qué proporción de las respuestas válidas de cada localidad corresponde a la opción elegida.' : 'La intensidad compara cuántas veces cada localidad eligió esta respuesta.'}</div>`;
  }

  function render() {
    const data = payload(result);
    const dataFeatures = data.feature_collection?.features || [];
    const baseFeatures = data.territory_background?.features || [];
    const background = data.background?.features || [];
    const influenceSites = data.influence_sites || [];
    const metrics = data.metrics || {};

    if (!data.map_type) {
      root.innerHTML = `<div class="app-shell">
        ${institutionalHeader()}
        <main class="page-container">
          <section class="landing">
            <div>
              <div class="eyebrow">Planeación basada en evidencia</div>
              <h1>Mapeo territorial de participación ciudadana</h1>
              <div class="landing-copy"><p>Convierte resultados de encuestas en mapas municipales para identificar cómo se distribuyen las respuestas entre localidades y colonias de Hidalgo.</p></div>
              <div class="landing-points" aria-label="Características del sistema">
                <div class="landing-point"><span class="landing-point__mark">1</span><span>Detecta automáticamente las columnas de municipio, localidad, pregunta y respuesta.</span></div>
                <div class="landing-point"><span class="landing-point__mark">2</span><span>Concentra todas las respuestas de una pregunta dentro de cada territorio.</span></div>
                <div class="landing-point"><span class="landing-point__mark">3</span><span>Genera un mapa municipal con cartografía oficial y una vista analítica de cobertura completa.</span></div>
              </div>
            </div>
            ${uploadPanel(false)}
          </section>
          <section class="institution-strip" aria-label="Alcance del sistema">
            <div class="institution-strip__item"><strong>Formato flexible</strong><span>Excel, XLS o CSV con encabezados descriptivos.</span></div>
            <div class="institution-strip__item"><strong>Cobertura Hidalgo</strong><span>Municipios, localidades y colonias del catálogo geográfico integrado.</span></div>
            <div class="institution-strip__item"><strong>Resultados agregados</strong><span>Frecuencias territoriales listas para análisis y comunicación institucional.</span></div>
          </section>
          ${institutionalFooter()}
        </main>
      </div>`;
      wireUpload();
      return;
    }

    if (coverageMode === 'influence' && !influenceSites.length) coverageMode = 'official';
    const projection = projectionFor(background, baseFeatures);
    const cells = influenceCells(influenceSites, projection);
    const layerOrder = feature => feature.properties?.geometry_kind === 'settlement' ? 1 : 0;
    const drawDataFeatures = [...dataFeatures].sort((a, b) => layerOrder(a) - layerOrder(b));
    const mappedKeys = new Set(drawDataFeatures.map(feature => String(feature.properties?.official_key || '')).filter(Boolean));
    const visibleBase = baseFeatures.filter(feature => !mappedKeys.has(String(feature.properties?.official_key || ''))).sort((a, b) => layerOrder(a) - layerOrder(b));
    const activeValues = coverageMode === 'influence' ? influenceSites : drawDataFeatures.map(feature => feature.properties || {});
    const valueFor = properties => mapValue(properties, data);
    const percentageMode = data.map_type === 'frequency' && metricMode === 'percentage';
    const max = percentageMode ? 100 : Math.max(...activeValues.map(valueFor), 1);
    data.metrics = {...metrics, max_locality_responses: Math.max(...activeValues.map(item => Number(item.total_participations || 0)), 1)};

    const municipalFillPaths = background.map(feature => `<path class="municipal-fill" fill-rule="evenodd" d="${pathFor(feature.geometry, projection)}"></path>`).join('');
    const municipalOutlinePaths = background.map(feature => `<path class="municipal-boundary" fill-rule="evenodd" d="${pathFor(feature.geometry, projection)}"></path>`).join('');
    const clipFeatures = background.length ? background : baseFeatures;
    const clipPaths = clipFeatures.map(feature => `<path fill-rule="evenodd" d="${pathFor(feature.geometry, projection)}"></path>`).join('');
    let gradientDefinitions = '';

    const basePaths = coverageMode === 'official' ? visibleBase.map((feature, index) => {
      const properties = feature.properties || {};
      const kind = properties.geometry_kind === 'settlement' ? 'settlement' : 'locality';
      return `<path class="official-base ${kind} focus-target" tabindex="0" data-index="${index}" data-focus="official-${esc(properties.official_key || index)}" d="${pathFor(feature.geometry, projection)}" fill-rule="evenodd" aria-label="${esc(properties.locality)}: unidad oficial sin datos en el Excel"></path>`;
    }).join('') : '';

    const dataPaths = coverageMode === 'official' ? drawDataFeatures.map((feature, index) => {
      const properties = feature.properties || {};
      const kind = properties.geometry_kind === 'settlement' ? 'settlement' : 'locality';
      const paint = paintFor(properties, data, max, `official-mix-${index}`);
      gradientDefinitions += paint.definition;
      const territoryClass = data.map_type === 'dominant' ? ' dominant-territory' : '';
      return `<path class="official-data ${kind}${territoryClass} focus-target" tabindex="0" data-index="${index}" data-focus="official-${esc(properties.official_key || index)}" d="${pathFor(feature.geometry, projection)}" fill="${paint.fill}" fill-opacity="${paint.opacity}" fill-rule="evenodd" aria-label="${esc(properties.locality)}: ${displayMapValue(valueFor(properties), data)}"></path>`;
    }).join('') : '';

    const influencePaths = coverageMode === 'influence' ? cells.map((cell, index) => {
      const paint = paintFor(cell.site, data, max, `influence-mix-${index}`);
      gradientDefinitions += paint.definition;
      const territoryClass = data.map_type === 'dominant' ? ' dominant-territory' : '';
      return `<path class="influence-zone${territoryClass} focus-target" tabindex="0" data-index="${index}" data-focus="site-${cell.sourceIndex}" d="${cell.path}" fill="${paint.fill}" fill-opacity="${paint.opacity}" aria-label="${esc(cell.site.locality)}: ${displayMapValue(valueFor(cell.site), data)}"></path>`;
    }).join('') : '';

    const officialOutlines = coverageMode === 'influence' ? [...baseFeatures].sort((a, b) => layerOrder(a) - layerOrder(b)).map(feature => {
      const kind = feature.properties?.geometry_kind === 'settlement' ? 'settlement' : 'locality';
      return `<path class="official-outline ${kind}" fill-rule="evenodd" d="${pathFor(feature.geometry, projection)}"></path>`;
    }).join('') : '';
    const osmContext = osmRoadsSvg(osmRoads, projection, clipPaths, osmEnabled);
    const maxMarkerVolume = Math.max(...(coverageMode === 'influence' ? influenceSites : drawDataFeatures.map(feature => feature.properties || {})).map(item => Number(item.total_participations || 0)), 1);
    const markerFor = (point, properties, index) => {
      if (!point) return '';
      const category = categoryColor(properties.dominant_answer, data.response_categories || []);
      const volume = Number(properties.total_participations || 0);
      const radius = Math.min(1.05, .42 + .42 * Math.sqrt(volume / maxMarkerVolume));
      const label = esc(properties.locality || 'Localidad');
      return `<g class="territory-marker" data-index="${index}"><circle class="territory-point" cx="${point[0]}" cy="${point[1]}" r="${radius}" fill="${category}"><title>${label}: ${esc(properties.dominant_answer || 'Sin respuesta predominante')}</title></circle><text class="territory-label" x="${point[0] + radius + .35}" y="${point[1] + .5}">${label}</text></g>`;
    };
    const officialMarkers = coverageMode === 'official' && data.map_type === 'dominant'
      ? drawDataFeatures.map((feature, index) => markerFor(centroidFor(feature.geometry, projection), feature.properties || {}, index)).join('')
      : '';
    const influenceMarkers = coverageMode === 'influence' && data.map_type === 'dominant'
      ? cells.map((cell, index) => markerFor(cell.point, cell.site || {}, index)).join('')
      : coverageMode === 'influence'
        ? cells.map(cell => `<circle class="site-marker" cx="${cell.point[0]}" cy="${cell.point[1]}" r=".42"><title>${esc(cell.site.locality)}</title></circle>`).join('')
        : '';
    const markers = officialMarkers + influenceMarkers;

    const rankingSource = coverageMode === 'influence'
      ? influenceSites.map(site => ({...site}))
      : drawDataFeatures.map(feature => ({...(feature.properties || {})}));
    const ranked = rankingSource.sort((a, b) => valueFor(b) - valueFor(a));
    const rows = ranked.slice(0, 15).map((properties, index) => {
      const detail = data.map_type === 'dominant'
        ? `Predomina: ${esc(properties.dominant_answer || 'Sin dato')} (${number(properties.frequency)})`
        : data.map_type === 'composition'
          ? `${number(properties.total_response_mentions || properties.frequency)} menciones · distribución completa en el polígono`
        : percentageMode
          ? `${number(properties.frequency)} mención(es) de ${number(properties.total_participations)} respuestas locales`
          : `${percent(properties.percentage_locality)}% de ${number(properties.total_participations)} respuestas locales`;
      return `<div class="rank-row"><span class="rank-no">${index + 1}</span><span>${esc(properties.locality)}<small class="rank-detail">${detail}</small></span><span class="rank-value">${displayMapValue(valueFor(properties), data)}</span></div>`;
    }).join('') || '<div class="context">No hay unidades geográficas con datos para ordenar.</div>';

    const nonmapped = data.unmatched_localities || [];
    const pointOnly = nonmapped.filter(item => item.classification === 'point_only');
    const invalid = nonmapped.filter(item => item.classification === 'unmatched');
    const missing = nonmapped.filter(item => item.classification === 'missing_locality');
    const diagnostics = [
      pointOnly.length ? `<div class="diagnostic"><strong>Localidades sólo puntuales:</strong> ${coverageMode === 'influence' ? 'incluidas en la cobertura analítica mediante su coordenada oficial' : 'sin área en la vista oficial'}: ${pointOnly.map(item => `${esc(item.locality)} (${number(item.total_participations)})`).join(', ')}.</div>` : '',
      invalid.length ? `<div class="diagnostic"><strong>No ubicables:</strong> ${invalid.map(item => `${esc(item.locality)} (${number(item.total_participations)})`).join(', ')}.</div>` : '',
      missing.length ? `<div class="diagnostic"><strong>Sin localidad declarada:</strong> ${number(metrics.missing_locality_records)} registro(s).</div>` : ''
    ].join('');

    const isInfluence = coverageMode === 'influence';
    const colored = isInfluence ? Number(metrics.influence_site_localities || influenceSites.length) : Number(metrics.georeferenced_polygons || dataFeatures.length);
    const totalOfficial = Number(metrics.official_territory_polygons || baseFeatures.length);
    const noData = Number(metrics.official_polygons_without_excel_data || Math.max(totalOfficial - colored, 0));
    const representedRecords = isInfluence ? Number(metrics.influence_records || 0) : Number(metrics.mapped_records || 0);
    const coverage = isInfluence ? Number(metrics.influence_coverage_percentage || 0) : Number(metrics.record_coverage_percentage || 0);
    const mentionLabel = data.map_type === 'composition' ? 'Respuestas de la pregunta' : data.map_type === 'dominant' ? 'Respuestas válidas agrupadas' : data.map_type === 'participation' ? 'Respuestas válidas' : 'Menciones de la respuesta';
    const notice = isInfluence
      ? `Cobertura completa analítica: todo el municipio se asigna a la localidad o colonia geográficamente más cercana. Los conteos provienen del Excel; las divisiones blancas son zonas de influencia, no límites oficiales de INEGI. Se superponen ${totalOfficial} polígonos oficiales como referencia.`
      : `Límites oficiales únicamente: ${colored} de ${totalOfficial} polígonos tienen datos vinculados y ${noData} permanecen en gris. Las áreas sin polígono publicado no se colorean en esta vista.`;
    const coverageMetric = isInfluence ? `${colored} sitios` : `${colored} / ${totalOfficial}`;
    const coverageMetricLabel = isInfluence ? 'Localidades/colonias representadas' : 'Polígonos oficiales con datos';

    const focusItems = isInfluence
      ? influenceSites.map((site, index) => ({value: `site-${index}`, label: site.locality}))
      : baseFeatures.map((feature, index) => ({value: `official-${feature.properties?.official_key || index}`, label: feature.properties?.locality || 'Unidad sin nombre'}));
    const focusOptions = focusItems.sort((a, b) => String(a.label).localeCompare(String(b.label), 'es')).map(item => `<option value="${esc(item.value)}">${esc(item.label)}</option>`).join('');
    const policy = isInfluence
      ? 'zonas de vecino más cercano (Voronoi) recortadas al límite municipal oficial; sus divisiones son analíticas'
      : 'sólo polígonos oficiales de localidad/asentamiento publicados por INEGI';
    const rankingTitle = data.map_type === 'composition' ? 'Volumen y distribución por localidad' : data.map_type === 'dominant' ? 'Volumen y respuesta predominante por localidad' : `${percentageMode ? 'Porcentaje local' : 'Frecuencia'} de “${esc(data.answer)}”`;
    const displayTitle = percentageMode ? `Porcentaje territorial — ${data.answer}` : (data.title || 'Mapa coroplético municipal');
    const topTerritory = ranked[0] || null;
    const maximumDisplay = topTerritory ? displayMapValue(valueFor(topTerritory), data) : '0';
    const warnings = (data.warnings || []).slice(0, 6);

    root.innerHTML = `<div class="app-shell">
      ${institutionalHeader()}
      <main class="page-container">
        <section class="result-heading">
          <div><div class="eyebrow">Resultado territorial</div><h1>${esc(displayTitle)}</h1></div>
          <div class="result-place"><div class="result-place__name">${esc(data.municipality || 'Municipio no especificado')}</div><div class="result-place__source">Límite municipal oficial INEGI</div></div>
        </section>
        ${publicMap ? '' : uploadPanel(true)}
        <div class="notice">${notice}</div>
        <section class="map-frame">
          <div class="map-toolbar">
            <button type="button" data-action="zoom-in">Acercar</button><button type="button" data-action="zoom-out">Alejar</button><button type="button" data-action="reset">Restablecer</button><button type="button" data-action="toggle-osm" aria-pressed="${osmEnabled ? 'true' : 'false'}">${osmEnabled ? 'Ocultar líneas OSM' : 'Mostrar líneas OSM'}</button>
            <select id="coverage-mode" aria-label="Elegir tipo de cobertura"><option value="official" ${!isInfluence ? 'selected' : ''}>Sólo límites oficiales</option><option value="influence" ${isInfluence ? 'selected' : ''}>Cobertura completa · influencia analítica</option></select>
            <select id="territory-focus" aria-label="Enfocar una localidad o colonia"><option value="">Enfocar localidad o colonia…</option>${focusOptions}</select>
            <span class="source">INEGI · Marco Geoestadístico y DCAH · Hidalgo · líneas OSM</span>
          </div>
          <div class="map-wrap"><svg class="map-svg" viewBox="0 0 100 100" role="img" aria-label="Mapa del municipio de ${esc(data.municipality)}"><title>${esc(displayTitle)}</title><desc>${isInfluence ? 'Cobertura municipal completa por influencia geográfica de localidades con datos.' : 'Coropleta con polígonos oficiales de localidades y asentamientos.'}</desc><defs><clipPath id="municipality-clip">${clipPaths}</clipPath>${gradientDefinitions}</defs><g class="map-layer"><rect x="0" y="0" width="100" height="100" fill="#edf2ef" fill-opacity="0"></rect>${municipalFillPaths}<g clip-path="url(#municipality-clip)">${influencePaths}</g>${basePaths}${dataPaths}${osmContext}${officialOutlines}${markers}${municipalOutlinePaths}</g></svg><div class="osm-attribution">Líneas viales: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap contributors</a></div><div class="map-key">${mapLegend(data)}</div><div id="tip" class="tooltip" hidden></div></div>
        </section>
        <section class="metrics">
          <div class="metric"><div class="metric-value">${number(metrics.mentions)}</div><div class="metric-label">${mentionLabel}</div></div>
          <div class="metric"><div class="metric-value">${coverageMetric}</div><div class="metric-label">${coverageMetricLabel}</div></div>
          <div class="metric"><div class="metric-value">${esc(topTerritory?.locality || 'Sin datos')}</div><div class="metric-label">Mayor intensidad</div></div>
          <div class="metric"><div class="metric-value">${maximumDisplay}</div><div class="metric-label">Máximo territorial</div></div>
        </section>
        <section class="below">
          <div class="panel"><h2>${rankingTitle}</h2><div class="ranking">${rows}</div></div>
          <div class="panel"><h2>Ficha y cobertura</h2><div class="context"><strong>Pregunta:</strong> ${esc(data.question || 'No especificada')}<br><strong>Clasificación:</strong> ${data.map_type === 'dominant' ? 'respuesta predominante por localidad/colonia' : esc(data.answer || 'Todas las respuestas')}<br><strong>Medida:</strong> ${data.map_type === 'composition' ? 'porcentaje de cada respuesta dentro de la localidad' : data.map_type === 'dominant' ? 'frecuencia absoluta de la respuesta predominante, con su porcentaje local' : percentageMode ? 'porcentaje dentro de cada localidad' : 'frecuencia absoluta por localidad'}.<br><strong>Agrupación:</strong> ${data.map_type === 'composition' ? 'cada polígono conserva todas las respuestas; el ancho de cada franja representa su porcentaje local.' : data.map_type === 'dominant' ? 'se comparan todas las respuestas válidas de cada localidad y se conserva la categoría con mayor frecuencia.' : 'se cuenta cuántas filas de cada localidad/colonia eligieron exactamente la respuesta seleccionada.'}<br><strong>Cobertura de registros:</strong> ${number(representedRecords)} de ${number(metrics.total_response_records)} (${percent(coverage)}%).<br><strong>Política geométrica:</strong> ${policy}.<br><strong>Importante:</strong> no se inventan respuestas ni se redistribuyen conteos entre localidades.</div>${diagnostics}${warnings.map(warning => `<div class="warning">${esc(warning)}</div>`).join('')}</div>
        </section>
        ${institutionalFooter()}
      </main>
    </div>`;

    bindMapPaths(visibleBase, drawDataFeatures, cells, data);
    const layer = root.querySelector('.map-layer');
    if (layer) layer.style.transform = `scale(${zoom})`;
    const focusSelect = root.querySelector('#territory-focus');
    root.querySelectorAll('[data-action="zoom-in"]').forEach(button => button.onclick = () => { zoom = Math.min(12, zoom + .5); layer.style.transform = `scale(${zoom})`; });
    root.querySelectorAll('[data-action="zoom-out"]').forEach(button => button.onclick = () => { zoom = Math.max(.7, zoom - .5); layer.style.transform = `scale(${zoom})`; });
    root.querySelectorAll('[data-action="reset"]').forEach(button => button.onclick = () => { zoom = 1; layer.style.transformOrigin = '50% 50%'; layer.style.transform = 'scale(1)'; if (focusSelect) focusSelect.value = ''; });
    const coverageSelect = root.querySelector('#coverage-mode');
    if (coverageSelect) coverageSelect.onchange = event => { coverageMode = event.target.value; zoom = 1; render(); };
    const osmToggle = root.querySelector('[data-action="toggle-osm"]');
    if (osmToggle) osmToggle.onclick = () => { osmEnabled = !osmEnabled; render(); };
    if (focusSelect) focusSelect.onchange = event => {
      const path = [...root.querySelectorAll('.focus-target')].find(item => item.dataset.focus === event.target.value);
      if (!path) return;
      const bounds = path.getBBox();
      const centerX = bounds.x + bounds.width / 2;
      const centerY = bounds.y + bounds.height / 2;
      zoom = Math.min(12, Math.max(4, 22 / Math.max(bounds.width, bounds.height, 1.5)));
      layer.style.transformOrigin = `${centerX}% ${centerY}%`;
      layer.style.transform = `scale(${zoom})`;
      path.focus();
    };
    wireUpload();
    ensureOsmRoads();

    if (publicMap && host?.publicMapVersionUrl) {
      const pollMilliseconds = Math.max(15000, Number(host.publicMapPollMs || 30000));
      window.setInterval(async () => {
        try {
          const response = await fetch(host.publicMapVersionUrl, { cache: 'no-store' });
          if (!response.ok) return;
          const current = await response.json();
          if (current.version && current.version !== host.publicMapVersion) {
            window.location.reload();
          }
        } catch (_) {
          // Keep the last valid map visible if the refresh endpoint is unavailable.
        }
      }, pollMilliseconds);
    }
  }

  window.addEventListener('message', event => {
    const message = event.data;
    if (message?.method === 'ui/notifications/tool-result') {
      result = message.params?.result || message.params;
      coverageMode = 'official';
      zoom = 1;
      render();
    }
  });
  render();
})();
</script>
